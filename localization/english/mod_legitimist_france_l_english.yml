l_english:
 mod_enact_slavery:0 "Promulgate Le Code Noir"
 mod_enact_slavery_desc:0 "We shall issue a new royal decree to re-establish the slave trade throughout France."
 mod_repudiate_paris:0 "Repudiate the Treaty of 1763"
 mod_repudiate_paris_desc:0 "The Treaty of Paris was a black day for France. We shall overturn it and reclaim Acadia."
 mod_louisiana_unpurchase:0 "Request the Return of Louisiana"
 mod_louisiana_unpurchase_desc:0 "Wasteful spendthrifts sold the colony of the Sun King to the United States. The Kingdom of France is now in a financial position to refund of that purchase."
 louisiana.4.t:0 "Louisiana Refund"
 louisiana.4.a:0 "Make the necessary arrangements..."
 louisiana.4.c:0 "Never again (why did you even ask?)"
 louisiana.4.d:0 "The return of the rightful dynasty to the throne of France means we can set to work correcting the unfortunate mistakes of our predecessors."
 louisiana.4.f:0 ""On behalf of his Majesty, the King of France, the offer stands at nine million pounds sterling.""
 louisiana.1.t:0 "A Request for a...Refund?"
 louisiana.1.a:0 "Very well. The Republic accepts."
 louisiana.1.b:0 "They cannot be serious. Is this some kind of joke?"
 louisiana.1.d:0 "Representatives of the Ancien Regime have approached the government with a request to "unpurchase" Louisiana. They offer a princely sum: nine million one thousand two hundred pounds, payable in hard specie."
 louisiana.1.f_ru:0 ""Mr. President, it would be an increase in the federal budget by more than half!""
 louisiana.2.t:0 "The Americans Accept!"
 louisiana.2.a:0 "Splendid news! But don't tell the Controller-General..."
 louisiana.2.f:0 ""The American government provisionally accepts your terms. When can the first payment be arranged?""
 louisiana.2.d:0 "We did not think they would seriously accept, but it seems the diplomatic overtures regarding the colony of the Sun King have been well received."
 louisiana.3.t:0 "An Expected Rejection"
 louisiana.3.b:0 "It was a good try, at least the Controller-General will be happy."
 louisiana.3.a:0 "We were asking for permission, but now it will have to be forgiveness..."
 louisiana.3.f:0 "A rejection, sire. Politely, firmly, and a rejection."
 louisiana.3.d:0 "The American delegation has declined our offer for Louisiana, claiming it is an "integral part" of the American nation."
 not_gave_up_on_west_text:0 "We have not concluded the return of French Louisiana."
 
