l_english:
 vfst_batch_ship_transfer:0 "Ship Batch Transfer"
 vfst_batch_ship_transfer_desc:0 "Choose a separate ship manifest for each seller and buyer. Exchange ships in both directions or prepare deals with several countries."
 vfst_batch_ship_transfer_effects_desc:0 "• Deliver all ships in this article's frozen manifest on entry into force.\n• Acceptance uses this batch's frozen quote, retained after delivery.\n• Frozen ships are reserved against duplicate batch sales. Renegotiation does not deliver them again."
 vfst_batch_ship_transfer_article_short_desc:0 "[SOURCE_COUNTRY.GetNameNoFormatting] transfers selected ships to [TARGET_COUNTRY.GetNameNoFormatting]"
 vfst_freeze_label:0 "Lock list"
 vfst_use_label:0 "Use this list"
 vfst_reset_label:0 "Clear"
 vfst_reset_help:0 "Clear this direction's selections across all pages and types, keeping the current group, subtype and page. This invalidates the old draft batch and releases its ships; remove its old article first. Submitted proposals must be answered or withdrawn."
 vfst_selection_help:0 "Select ships, then Lock list, Use this list and Add. Locked ships are reserved. Lists for other countries or directions remain independent. Clear invalidates this batch and releases its ships; remove its old draft article first. Submitted proposals must be answered or withdrawn."
 vfst_selection_count:0 "Selected: [GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('seller', ArticleDraft.GetFirstOrSource.MakeScope).AddScope('buyer', ArticleDraft.GetSecondOrTarget.MakeScope).ScriptValue('vfst_ui_count')|0] ships   Filtered: [GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('seller', ArticleDraft.GetFirstOrSource.MakeScope).AddScope('buyer', ArticleDraft.GetSecondOrTarget.MakeScope).ScriptValue('vfst_ui_filtered_count')|0] ships"
 vfst_manifest_required:0 "This article has an independent valid manifest: undelivered ships are owned by the seller and not in battle, and the buyer has a port. Delivered articles use their saved receipt."
 vfst_no_other_ship_articles:0 "Do not combine batch transfers with single-ship or fleet-transfer articles in the same treaty."
 vfst_select_all_label:0 "Select all"
 vfst_select_all_help:0 "Select available ships on every page matching the current group and subtype filters. Keep the filters, current page and existing selections from other types. Skip ships reserved elsewhere, in battle or at zero hull strength."
 vfst_select_page_label:0 "Select page"
 vfst_select_page_help:0 "Add only available ships displayed on the current filtered page. Keep selections from other pages and types. Skip ships reserved elsewhere or in battle."
 vfst_type_filter_heading:0 "Ship filters"
 vfst_type_filter_help:0 "Show all ships and clear the group and subtype filters. Return to page one and keep selections."
 vfst_all_types_label:0 "All ships"
 vfst_prev_page_label:0 "Previous"
 vfst_next_page_label:0 "Next"
 vfst_page_status:0 "Page [GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('seller', ArticleDraft.GetFirstOrSource.MakeScope).AddScope('buyer', ArticleDraft.GetSecondOrTarget.MakeScope).ScriptValue('vfst_ui_page_number')|0] / [GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('seller', ArticleDraft.GetFirstOrSource.MakeScope).AddScope('buyer', ArticleDraft.GetSecondOrTarget.MakeScope).ScriptValue('vfst_ui_total_pages')|0]"
 vfst_page_help:0 "Up to 8 ships per page. Turning pages keeps selections. Locking includes all ships selected across pages and types."
 vfst_empty_page:0 "No ships match the current filters. Choose another group or subtype, or All ships."
 vfst_choose_group_label:0 "All types"
 vfst_all_subtypes_label:0 "All types"
 vfst_group_torpedo_label:0 "Torpedo craft"
 vfst_group_filter_help:0 "Choose All types, Capital Ships, Cruisers or Torpedo Craft. All types shows every group. Changing group clears the subtype filter and returns to page one, keeping all selections."
 vfst_subtype_filter_help:0 "All types shows every ship in the current group, or every ship if the group is also All types. Select a specific group to choose one of its subtypes. Options come from the current seller's native ship-type list."
