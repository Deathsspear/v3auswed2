l_english:
 je_forest_of_bayonets_reason: "#italic "I am an aristocrat by birth and by conviction and completely agree with you that people must strive for conservatism and do everything to achieve it. Yet we differ about means. Your means consist of a forest of bayonets and fixed adherence to things as they are. To my mind, by following these lines we are playing into the hands of the revolutionaries… Your ways will lead us… not tomorrow or next year — but soon enough — to our ruin"#! \n — Franz Anton von Kolowrat-Liebsteinsky. \n\n Since the end of the Napoleonic Wars, the reactionary order enshrined at the $glossary_congress_of_vienna$ has reigned across [GetGeographicRegion('geographic_region_europe').GetName]. Despite the shock provided by the [glossary_revolutions_of_1830], the integration of #b Belgium#! and the French #b July Monarchy#! into the Congress order has assured its survival for the time being. Fearful of another $glossary_1792$, the absolutist and conservative constitutional regimes alike have formed a phalanx to repress any hint of revolutionary activity.\n\nEven with these efforts, however, the dream of Liberty, Equality, and Fraternity is not dead. [Concept('concept_revolution', '$concept_revolutionary|q$')] forces remain dedicated to overthrowing the Congress order, and the resentment of the impoverished and disenfranchised working class has created the threat of social eruption within every European capital. Given a sufficient spark, all of Europe may find itself aflame.\n\n@warning! If [Concept('concept_revolution', '$concept_revolutionary|q$')] activity hits critical mass, the fragile Congress order will erupt into a #b Revolutionary Spring#!"