l_english:
 chaebol_event.1.t:0 "The Rise of the Chaebols"
 chaebol_event.1.d:0 "Jeonha, we come to you with a proposal."
 chaebol_event.1.f:0 "Throughout our nation the tides of industralisation are rising. We implore you to guide us through them rather than allow our nation to be swept away. Listers in Jeonju. Locomotive designers in Busan. Coal miners in Pyongyang. Herbalists in Hanseong. Tobacconists in Yangho. Whalers in Gangneung. Tailors in Incheon. Your own Royal Guards in these very halls. All stand ready to guide the realm through these tumultuous tides, you have only to give the word."
 chaebol_event.1.a:0 "Begin..."
 the_chaebols_modifier:0 "The Chaebols"
 the_chaebols_inefficient_modifier:0 "Too Many Cooks..."
 the_chaebols_established_modifier:0 "An Uneasy Partnership"
 the_chaebols_landowners_happy_modifier:0 "Landowners Support Industrial Expansion"
 je_chaebol_control:0 "Control the Chaebols"
 je_chaebol_control_reason:0 "The establishment of the Chaebols has brought rapid industrialisation to the realm, but has also strengthened the hand of the landowners, you must take action to reign them in, and ensure the Crown benefits from this newfound wealth.\n \n #R If you fail to complete this journal entry you will lose your extra company slots, do not pursue companies other than those listed here, do not disband any of these companies once formed. #R "
 pyongyang_mining_prosperous:0 "Pyongyang Mining is Prosperous"
 je_chaebol_control_anthracite:0 "Regulate Anthracite"
 je_chaebol_control_anthracite_desc:0 "Enact a proclamation to control the movement of Anthracite across provincial borders and thereby exert influence over Pyongyang Mining."
 the_chaebols_anthracite_interest:0 "An Interest in Anthracite Mining"
 je_chaebol_control_living_engines:0 "Reassure Engineers"
 je_chaebol_control_living_engines_desc:0 "Reports have reached the palace that living tools occasionally seem to move of their own accord. One even wonders whether they may be able to work without human intervention. Of course the workers who use these tools find them somewhat unnerving. A brief visit by the King to a factory should ease these concerns."
 busan_trains_prosperous:0 "Busan Locomotives is Prosperous"
 the_chaebols_living_engines_interest:0 "An Interest in Living Tools"
 je_chaebol_control_gromwell_purple:0 "Rumors of a Favourite Colour"
 je_chaebol_control_gromwell_purple_desc:0 "Rumors abound of the King's love of purple, and in particular the shade produced by Gromewll Purple. This has caused an explosion of interest in the dye. Of course, were the King to deny those rumors, that explosion would turn to a whimper."
 doyeinso_offices_prosperous:0 "Doyeinso Offices is Prosperous"
 the_chaebols_gromwell_purple_interest:0 "An Interest in Gromwell Purple"
 je_chaebol_control_ginseng:0 "Endorse Ginseng Tea"
 je_chaebol_control_ginseng_desc:0 "The King is a picture of health, truly. He is said to have told his closest friends that the secret is a daily cup of Ginseng Tea. Naturally, his subjects now demand a cup a day and liquor sales have declined. But were the King's health to take a turn, perhaps interest in Ginseng would also..."
 the_chaebols_ginseng_interest:0 "An Interest in Ginseng"
 royal_herbalists_prosperous:0 "Royal Herbalists Guild is Prosperous"
 je_chaebol_control_koksan_leaf:0 "Confirm Smoking is not Addictive"
 je_chaebol_control_koksan_leaf_desc:0 "The King has lent public support to findings from Hwanghae Plantations that smoking is neither addictive nor damaging to your health. In fact, he contined, a strict daily ration of Koksan Leaf can serve to properly motivate workers. Naturally, employers around the Kingdom are rushing to secure a steady supply."
 the_chaebols_koksan_leaf_interest:0 "An Interest in Koksan Leaf"
 hwanghae_plantation_prosperous:0 "Hwanghae Plantations is Prosperous"
 je_chaebol_control_leviathans_balm:0 "Cosmeticists adopt Leviathan's Balm"
 je_chaebol_control_leviathans_balm_desc:0 "Word has spread amongst the women of the court of the healthy glow provided to the skin by the liberal application of Levianthan's Balm. It is becoming a very popular cosmetic product and is also an excellent industrial lubricant. Dreams of screaming whales should be ignored."
 dunwall_whaling_prosperous:0 "Dunwall Whaling is Prosperous"
 the_chaebols_leviathans_balm_interest:0 "An Interest in Leviathans Balm"
 je_chaebol_control_dragonfly_robes:0 "Publicly Wear Dragonfly Robes"
 je_chaebol_control_dragonfly_robes_desc:0 "It is whispered among the peasantry that the King has been spotted in clothes they can afford. How generous of him to let even the meanest worker taste a little grandeur. One must admire the product placement."
 mosi_textiles_prosperous:0 "Mosi Textiles is Prosperous"
 the_chaebols_dragonfly_robes_interest:0 "An Interest in Dragonfly Robes"
 je_chaebol_control_siwidae_cannons:0 "Restrict Access to Synthetic Fertilizers"
 je_chaebol_control_siwidae_cannons_desc:0 "It just makes good sense that critical inputs in weapons manufacturing can only be accessed by actors alinged with the King. Naturally, the needs of farmers come second to those of national security."
 the_chaebols_siwidae_cannons_interest:0 "An Interest in Sulphur Bentonite"
 gigigang_arsenal_prosperous:0 "Gigi-Gang Arsenal is Prosperous"
 anthracite_controlled:0 "An interest in Anthracite secured"
 living_engines_controlled:0 "An interest in Living Tools secured"
 ginseng_controlled:0 "An interest in Ginseng secured"
 gromwell_purple_controlled:0 "An interest in Gromwell Purple secured"
 leviathans_balm_controlled:0 "An interest in Leviathans Balm secured"
 dragonfly_robes_controlled:0 "An interest in Dragonfly Robes secured"
 siwidae_cannons_controlled:0 "An interest in Sulfur Bentonite secured"
 the_chaebols_subdued:0 "The Golden Share"

 je_chaebol_rise:0 "The Rise of the Chaebols"
 je_chaebol_rise_reason:0 "Begin... And with your word, the Yangban Officials began to change. No longer mere beaurarats or officers but now, more. Will you come to regret this decision? \n  \n #R If you fail to complete this journal entry you will lose your extra company slots, do not pursue companies other than those listed here, do not disband any of these companies once formed. #R"
 
 chaebol_event.2.t:0 "All that work for nothing :("
 chaebol_event.2.d:0 "You have truly failed miserably, historians will remember you poorly."
 chaebol_event.2.a:0 "All that work for nothing :("
 chaebol_event.4.t:0 "All that work for nothing :("
 chaebol_event.4.d:0 "You have truly failed miserably, historians will remember you poorly."
 chaebol_event.4.a:0 "All that work for nothing :("
 chaebol_event.3.t:0 "Your Efforts Are Appreciated"
 chaebol_event.3.d:0 "You founded them to be servants. To make you rich. And truly, it seemed like a good idea at the time."
 chaebol_event.3.f:0 "That these eight would slip your control could not have been forseen. But slip they have. The Yangban Officials have already been consumed. Will you reassert control, or be devoured yourself?"
 chaebol_event.3.a:0 "Your Creations Appreicate Your Efforts"
 the_chaebols_name:0 "The Chaebols"
 ideology_chaebol_paternalistic:0 "Chaebol Paternalistic"
 ideology_chaebol_paternalistic_desc:0 "This group has little faith in the populace attempting to govern itself, but favours evolving away from the traditional aristocracy towards a system better able to benefit the new institutions they control."
 ideology_chaebol_hierarchic: "Chaebol Hierarchic"
 ideology_chaebol_hierarchic_desc: "This group favours maintaining a hierarchy but supports change to shift power to the new institutions they control."
 the_chaebols_give_temporary_approval:0 "Your Efforts Are Appreciated"