l_simp_chinese:
 vfst_batch_ship_transfer:0 "船舰批量转让"
 vfst_batch_ship_transfer_desc:0 "按交易双方分别选择军舰，每批名单独立保存。同一条约可以双向交换，也可以同时筹划与多个国家的交易。"
 vfst_batch_ship_transfer_effects_desc:0 "• 生效时交付本条款锁定的全部军舰。\n• 接受度读取本批次锁定时的估值；签约后仍保留记录。\n• 已锁定军舰不能重复用于另一份名单，重议不会重复交付。"
 vfst_batch_ship_transfer_article_short_desc:0 "[SOURCE_COUNTRY.GetNameNoFormatting]向[TARGET_COUNTRY.GetNameNoFormatting]转让所选军舰"
 vfst_freeze_label:0 "锁定名单"
 vfst_use_label:0 "使用这个名单"
 vfst_reset_label:0 "清空"
 vfst_reset_help:0 "清空此方向跨所有页面和类型的已选军舰，保留当前大类、小类和页码。清空会作废本批次旧草稿并释放预留，请先移除旧条款。已提出的条约需等待答复或撤销。"
 vfst_selection_help:0 "勾选 → 底部锁定名单 → 使用这个名单 → 添加。锁定会预留军舰，其他条约不能重复选择；切换国家或方向不影响本名单。清空会使本批次旧草稿失效并释放预留，请先移除旧条款。已提出的条约需等待答复或撤销。"
 vfst_selection_count:0 "此方向已选：[GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('seller', ArticleDraft.GetFirstOrSource.MakeScope).AddScope('buyer', ArticleDraft.GetSecondOrTarget.MakeScope).ScriptValue('vfst_ui_count')|0] 艘　筛选结果：[GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('seller', ArticleDraft.GetFirstOrSource.MakeScope).AddScope('buyer', ArticleDraft.GetSecondOrTarget.MakeScope).ScriptValue('vfst_ui_filtered_count')|0] 艘"
 vfst_manifest_required:0 "本条款具有有效的独立名单：待交付军舰仍属于交出国且未参战、接收国有港口；已交付条款使用保留的交易记录。"
 vfst_no_other_ship_articles:0 "同一条约中请勿将批量军舰转让与单舰或整支舰队转让条款并用。"
 vfst_select_all_label:0 "全选"
 vfst_select_all_help:0 "选中当前大类和小类筛选下所有页面的可用军舰，保留当前筛选、页码及其他类型的已有勾选。跳过其他名单已预留、正在战斗或零耐久的军舰。"
 vfst_select_page_label:0 "选中当前页"
 vfst_select_page_help:0 "只追加当前筛选、当前页显示的可用军舰。其他页和舰型的勾选保留；已预留给其他名单或正在战斗的军舰会跳过。"
 vfst_type_filter_heading:0 "军舰分类"
 vfst_type_filter_help:0 "显示全部军舰，并清除大类和子类筛选。回到第一页，保留已选名单。"
 vfst_all_types_label:0 "全部军舰"
 vfst_prev_page_label:0 "上一页"
 vfst_next_page_label:0 "下一页"
 vfst_page_status:0 "第 [GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('seller', ArticleDraft.GetFirstOrSource.MakeScope).AddScope('buyer', ArticleDraft.GetSecondOrTarget.MakeScope).ScriptValue('vfst_ui_page_number')|0] / [GuiScope.SetRoot(GetPlayer.MakeScope).AddScope('seller', ArticleDraft.GetFirstOrSource.MakeScope).AddScope('buyer', ArticleDraft.GetSecondOrTarget.MakeScope).ScriptValue('vfst_ui_total_pages')|0] 页"
 vfst_page_help:0 "每页最多8艘。翻页保留勾选；锁定名单时包含各页、各舰型累计选择的全部军舰。"
 vfst_empty_page:0 "当前筛选没有可显示的军舰。可切换大类、子类或点击全部军舰。"
 vfst_choose_group_label:0 "所有类型"
 vfst_all_subtypes_label:0 "所有类型"
 vfst_group_torpedo_label:0 "鱼雷艇"
 vfst_group_filter_help:0 "选择所有类型、主力舰、巡洋舰或鱼雷艇类。所有类型显示全部大类。切换大类会清除小类筛选，回到第一页；已勾选军舰保留。"
 vfst_subtype_filter_help:0 "所有类型显示当前大类下的全部军舰；大类也为所有类型时显示全部军舰。选择具体大类后，可进一步选择该类的舰型。选项取自当前交出方的原生舰型列表。"
